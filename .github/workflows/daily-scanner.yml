name: 每日新词扫描 & AI 日报

on:
  # 🔥 push main 时跑（你更新了采集脚本或评分标准）
  push:
    branches:
      - main
    paths:
      - "scripts/daily-scanner/**"
      - ".github/workflows/daily-scanner.yml"
  # ⏰ 每天 UTC 2:00（北京时间 10:00）自动跑
  schedule:
    - cron: "0 2 * * *"
  # 🖐️ 手动触发
  workflow_dispatch:

permissions:
  contents: write  # 允许 git push 日报

jobs:
  scan-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: scripts/daily-scanner/package-lock.json

      - name: 安装依赖
        working-directory: scripts/daily-scanner
        run: npm ci

      # ===== 第 1 步: 数据采集 =====
      - name: ① 数据采集（10 来源）
        working-directory: scripts/daily-scanner
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node index.js --full

      # ===== 第 2 步: AI 分析 =====
      - name: ② AI 分析生成日报
        working-directory: scripts/daily-scanner
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: node analyze.js

      # ===== 第 3 步: 日报提交回 Git =====
      - name: ③ 提交日报到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 只 commit 当天生成的 output 目录
          DATE_DIR=$(date +%Y-%m-%d)
          git add scripts/daily-scanner/output/${DATE_DIR}/

          if git diff --staged --quiet; then
            echo "📭 没有新的日报需要提交"
          else
            git commit -m "📊 新词日报 ${DATE_DIR}"
            git push
            echo "✅ 日报已提交！"
          fi
