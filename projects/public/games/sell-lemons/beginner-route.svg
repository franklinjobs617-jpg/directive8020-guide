<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sell Lemons beginner route</title>
  <desc id="desc">A simple beginner flow from manual cash to automation, newest activity, events, and key routes.</desc>
  <rect width="1200" height="675" fill="#FFF9E6"/>
  <rect x="54" y="52" width="1092" height="571" rx="28" fill="#FFFFFF" stroke="#E6D58B" stroke-width="4"/>
  <text x="90" y="116" fill="#151515" font-family="Arial, sans-serif" font-size="42" font-weight="700">Sell Lemons Beginner Route</text>
  <text x="90" y="158" fill="#5D5D5D" font-family="Arial, sans-serif" font-size="22">Do not click forever. Build passive income first, then run key routes.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(92 230)">
      <rect width="185" height="150" rx="18" fill="#FFE66D" stroke="#151515" stroke-width="3"/>
