      <text x="24" y="84" font-size="18" fill="#151515">Click only until</text>
      <text x="24" y="110" font-size="18" fill="#151515">automation appears</text>
    </g>
    <path d="M292 305 H372" stroke="#151515" stroke-width="6" stroke-linecap="round"/>
    <path d="M372 305 l-18 -14 v28 z" fill="#151515"/>
    <g transform="translate(386 230)">
      <rect width="185" height="150" rx="18" fill="#9BE7C2" stroke="#151515" stroke-width="3"/>
      <text x="24" y="45" font-size="24" font-weight="700" fill="#151515">2. Automate</text>
      <text x="24" y="84" font-size="18" fill="#151515">Buy managers</text>
      <text x="24" y="110" font-size="18" fill="#151515">when affordable</text>
    </g>
    <path d="M586 305 H666" stroke="#151515" stroke-width="6" stroke-linecap="round"/>
    <path d="M666 305 l-18 -14 v28 z" fill="#151515"/>
    <g transform="translate(680 230)">
      <rect width="185" height="150" rx="18" fill="#9BD7FF" stroke="#151515" stroke-width="3"/>
      <text x="24" y="45" font-size="24" font-weight="700" fill="#151515">3. Newest</text>
      <text x="24" y="84" font-size="18" fill="#151515">Push the latest</text>
      <text x="24" y="110" font-size="18" fill="#151515">activity unlock</text>
    </g>
    <path d="M880 305 H960" stroke="#151515" stroke-width="6" stroke-linecap="round"/>
    <path d="M960 305 l-18 -14 v28 z" fill="#151515"/>
    <g transform="translate(974 230)">
      <rect width="138" height="150" rx="18" fill="#FFB3C7" stroke="#151515" stroke-width="3"/>
      <text x="20" y="45" font-size="24" font-weight="700" fill="#151515">4. Keys</text>
      <text x="20" y="84" font-size="18" fill="#151515">Run sewer</text>
      <text x="20" y="110" font-size="18" fill="#151515">routes later</text>
    </g>
  </g>
  <rect x="92" y="450" width="1020" height="96" rx="18" fill="#151515"/>
  <text x="124" y="492" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="700">Rule</text>
  <text x="124" y="526" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21">If a purchase saves attention or multiplies a full income source, it beats a small manual boost.</text>
